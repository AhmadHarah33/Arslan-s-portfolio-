<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahmed Arslan Terminal</title>
<meta name="description" content="Ahmed Arslan, software engineer and after-sales engineer for dental CAD/CAM, 3D printing and lab equipment.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1016'/%3E%3Cpath d='M9 7c3 0 4 1.5 7 1.5S20 7 23 7c3 0 4 3 3.5 7-.4 3-1.8 4.5-2.3 7.5-.4 2.5-1 4.5-2.4 4.5-1.8 0-2-4-3-6.5-.4-1-1.2-1.5-1.8-1.5s-1.4.5-1.8 1.5c-1 2.5-1.2 6.5-3 6.5-1.4 0-2-2-2.4-4.5C7.3 18.5 5.9 17 5.5 14 5 10 6 7 9 7z' fill='%23a493ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
  <header class="status" aria-label="Lab status">
    <span class="status__id"><b>MARS-LAB</b> tty1</span>
    <span class="status__item" title="Resin printer light engine">UV <b id="st-uv">405</b>nm</span>
    <span class="status__item" title="Zirconia mill spindle">SPINDLE <b id="st-rpm">0</b>rpm</span>
    <span class="status__item" title="Sintering furnace">FURNACE <b id="st-temp">24</b>°C</span>
    <span class="status__item status__uptime" title="Time at Mars Med Dent">UPTIME <b id="st-up">3y</b></span>
  </header>

  <main class="screen" id="screen" aria-live="polite">
    <div id="out" class="out"></div>
    <form class="prompt-line" id="prompt-form" autocomplete="off">
      <label for="cmd" class="prompt" id="prompt-label"></label>
      <input id="cmd" class="cmd" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="send" aria-label="Type a command">
    </form>
    <noscript><p class="out">This terminal needs JavaScript. Ahmed Arslan, software engineer and after-sales engineer at Mars Med Dent. github.com/AhmadHarah33</p></noscript>
  </main>

  <nav class="chips" id="chips" aria-label="Quick commands"></nav>
</div>
<script src="js/data.js"></script>
<script src="js/terminal.js"></script>
</body>
</html>
